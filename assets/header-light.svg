<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 230" width="100%" height="100%">
  <defs>
    <pattern id="grid-light" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.75" fill="#D4D4D8" opacity="0.7"/>
    </pattern>
    <linearGradient id="surface-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFBF9"/>
      <stop offset="100%" stop-color="#F4F3EF"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="880" height="230" rx="10" fill="url(#surface-light)" stroke="#E4E4E7" stroke-width="1"/>
  <rect x="1" y="1" width="878" height="228" rx="9" fill="url(#grid-light)"/>

  <!-- Top Editorial Meta Bar -->
  <line x1="36" y1="42" x2="844" y2="42" stroke="#E4E4E7" stroke-width="1"/>
  <line x1="36" y1="42" x2="168" y2="42" stroke="#D95D39" stroke-width="1.5"/>

  <text x="36" y="30" fill="#71717A" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" letter-spacing="2">
    ISSUE 01 // PERSONAL MONOGRAPH
  </text>
  <text x="844" y="30" text-anchor="end" fill="#71717A" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1.5">
    C++20 · QT 6 · WIN32 · AGENT RUNTIME
  </text>

  <!-- Left Column: Editorial Identity -->
  <text x="36" y="96" fill="#18181B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="600" letter-spacing="-0.8">
    Fengyue Shao
  </text>
  <circle cx="262" cy="84" r="3.5" fill="#D95D39"/>
  <text x="276" y="94" fill="#52525B" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="17">
    Systems &amp; Desktop Engineer in Training
  </text>

  <text x="36" y="132" fill="#27272A" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14.5" font-weight="400">
    从真实系统问题出发，构建兼具原生体验与清晰边界的桌面软件与 Agent 工具。
  </text>
  <text x="36" y="156" fill="#71717A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
    Crafting native Windows interfaces, isolated plugin hosts, and verifiable local agent workflows.
  </text>

  <!-- Bottom Left Tags -->
  <g transform="translate(36, 178)">
    <rect x="0" y="0" width="132" height="24" rx="4" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1"/>
    <circle cx="12" cy="12" r="3" fill="#D95D39"/>
    <text x="22" y="15.5" fill="#27272A" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5">Native Desktop</text>

    <rect x="142" y="0" width="136" height="24" rx="4" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1"/>
    <circle cx="154" cy="12" r="3" fill="#2563EB"/>
    <text x="164" y="15.5" fill="#27272A" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5">System Boundary</text>

    <rect x="288" y="0" width="138" height="24" rx="4" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1"/>
    <circle cx="300" cy="12" r="3" fill="#16A34A"/>
    <text x="310" y="15.5" fill="#27272A" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5">Agent Execution</text>
  </g>

  <!-- Right Column: Minimalist Architectural Schematic -->
  <g transform="translate(615, 62)">
    <!-- Outer Frame -->
    <rect x="0" y="0" width="229" height="140" rx="6" fill="#FFFFFF" fill-opacity="0.9" stroke="#E4E4E7" stroke-width="1"/>
    <line x1="0" y1="26" x2="229" y2="26" stroke="#F4F4F5" stroke-width="1"/>
    <circle cx="13" cy="13" r="2.5" fill="#D95D39"/>
    <circle cx="23" cy="13" r="2.5" fill="#D4D4D8"/>
    <circle cx="33" cy="13" r="2.5" fill="#D4D4D8"/>
    <text x="217" y="16.5" text-anchor="end" fill="#A1A1AA" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5">
      ARCH // LAYERED
    </text>

    <!-- Layer 1 -->
    <rect x="14" y="36" width="201" height="24" rx="3" fill="#FAFAFA" stroke="#E4E4E7" stroke-width="0.8"/>
    <text x="24" y="51.5" fill="#18181B" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10" font-weight="600">01</text>
    <text x="44" y="51.5" fill="#3F3F46" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10">HUD &amp; QML Surface</text>
    <text x="205" y="51.5" text-anchor="end" fill="#2563EB" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9" font-weight="600">UI</text>

    <!-- Connector -->
    <line x1="114.5" y1="60" x2="114.5" y2="69" stroke="#D4D4D8" stroke-width="1"/>

    <!-- Layer 2 -->
    <rect x="14" y="69" width="201" height="24" rx="3" fill="#FAFAFA" stroke="#E4E4E7" stroke-width="0.8"/>
    <text x="24" y="84.5" fill="#18181B" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10" font-weight="600">02</text>
    <text x="44" y="84.5" fill="#3F3F46" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10">C++20 / WinRT Host</text>
    <text x="205" y="84.5" text-anchor="end" fill="#D95D39" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9" font-weight="600">SYS</text>

    <!-- Connector -->
    <line x1="114.5" y1="93" x2="114.5" y2="102" stroke="#D4D4D8" stroke-width="1" stroke-dasharray="2 2"/>

    <!-- Layer 3 -->
    <rect x="14" y="102" width="201" height="24" rx="3" fill="#FAFAFA" stroke="#E4E4E7" stroke-width="0.8"/>
    <text x="24" y="117.5" fill="#18181B" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10" font-weight="600">03</text>
    <text x="44" y="117.5" fill="#3F3F46" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10">IPC Plugin &amp; Agent</text>
    <text x="205" y="117.5" text-anchor="end" fill="#16A34A" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9" font-weight="600">SANDBOX</text>
  </g>
</svg>
